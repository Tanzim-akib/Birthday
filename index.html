<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Tonoy!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Poppins', sans-serif; background: #0f172a; color: white; }
        
        /* Magical Animated Background */
        .bg-bubbles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .bg-bubbles li { position: absolute; list-style: none; display: block; width: 40px; height: 40px; background-color: rgba(255, 255, 255, 0.15); bottom: -160px; animation: square 25s infinite; transition-timing-function: linear; border-radius: 50%; }
        .bg-bubbles li:nth-child(1) { left: 10%; }
        .bg-bubbles li:nth-child(2) { left: 20%; width: 80px; height: 80px; animation-delay: 2s; animation-duration: 17s; }
        .bg-bubbles li:nth-child(3) { left: 25%; animation-delay: 4s; }
        .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 22s; background-color: rgba(255, 255, 255, 0.25); }
        .bg-bubbles li:nth-child(5) { left: 70%; }
        .bg-bubbles li:nth-child(6) { left: 80%; width: 120px; height: 120px; animation-delay: 3s; background-color: rgba(255, 255, 255, 0.2); }
        .bg-bubbles li:nth-child(7) { left: 32%; width: 160px; height: 160px; animation-delay: 7s; }
        .bg-bubbles li:nth-child(8) { left: 55%; width: 20px; height: 20px; animation-delay: 15s; animation-duration: 40s; }
        .bg-bubbles li:nth-child(9) { left: 25%; width: 10px; height: 10px; animation-delay: 2s; animation-duration: 40s; background-color: rgba(255, 255, 255, 0.3); }
        .bg-bubbles li:nth-child(10) { left: 90%; width: 160px; height: 160px; animation-delay: 11s; }
        @keyframes square { 0% { transform: translateY(0); } 100% { transform: translateY(-700px) rotate(600deg); } }

        /* Page Transitions */
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out; transform: translateY(20px); }
        .page.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

        /* Polaroid Effect */
        .polaroid { background: white; padding: 15px 15px 40px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: rotate(-3deg); transition: transform 0.3s; width: 300px; }
        .polaroid:hover { transform: rotate(0deg) scale(1.05); }
        .polaroid img { width: 100%; height: 350px; object-fit: cover; background: #eee; }
        .polaroid-text { color: #333; font-family: 'Brush Script MT', cursive; font-size: 24px; text-align: center; margin-top: 15px; outline: none; }

        /* Glassmorphism Card */
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }

        /* Editable Text Styling */
        [contenteditable]:hover { background: rgba(255, 255, 255, 0.1); border-radius: 8px; cursor: text; }
        [contenteditable]:focus { background: rgba(255, 255, 255, 0.2); outline: none; border-radius: 8px; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 relative">

    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- PAGE 1: The Surprise -->
    <div id="page1" class="page active px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">I Have a Surprise For You...</h1>
        <p class="text-lg text-gray-300 mb-8">Are you ready?</p>
        <button onclick="nextPage(2)" class="px-8 py-4 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full font-bold text-xl hover:scale-105 transition-transform shadow-lg shadow-purple-500/50">
            Open the Surprise ✨
        </button>
    </div>

    <!-- PAGE 2: The Memory -->
    <div id="page2" class="page px-4 text-center">
        <h2 class="text-3xl md:text-5xl font-bold mb-8 text-white">To the most beautiful person...</h2>
        
        <div class="polaroid mx-auto mb-10">
            <!-- Image goes here -->
            <img src="image_9ac23c.jpg" alt="Tonoy's Picture">
            <div class="polaroid-text" contenteditable="true">Keep smiling always! ❤️</div>
        </div>

        <button onclick="nextPage(3)" class="px-8 py-3 bg-white/20 hover:bg-white/30 border border-white/50 rounded-full font-bold text-lg backdrop-blur-sm transition-all">
            Continue ➡️
        </button>
    </div>

    <!-- PAGE 3: The Party -->
    <div id="page3" class="page px-4">
        <div class="glass-card max-w-xl w-full mx-auto p-8 md:p-12 rounded-3xl text-center relative z-10">
            
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-pink-400" contenteditable="true">
                Happy Birthday, Tonoy! 🎂
            </h1>
            
            <p class="text-lg md:text-xl text-gray-200 mb-8 leading-relaxed font-light" contenteditable="true">
                Wishing you a day filled with happiness and a year filled with joy. 
                May all your dreams come true today and always. Have a blast! 🎉
            </p>
            
            <button onclick="fireConfetti()" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 hover:from-yellow-300 hover:to-red-400 text-white font-bold rounded-full shadow-lg shadow-orange-500/50 transform hover:-translate-y-1 transition duration-300 text-lg">
                Trigger the Magic! 🎊
            </button>
        </div>
    </div>

    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById('page' + pageNumber).classList.add('active');
            
            if(pageNumber === 3) {
                setTimeout(() => {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
                }, 500);
            }
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
