<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Tonoy!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Poppins', sans-serif; 
            background: #0f172a; 
            color: white; 
        }
        
        /* Floating Bubbles Background */
        .bg-bubbles { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; margin: 0; padding: 0; pointer-events: none; }
        .bg-bubbles li { position: absolute; list-style: none; display: block; width: 40px; height: 40px; background-color: rgba(255, 255, 255, 0.12); bottom: -160px; animation: square 25s infinite; transition-timing-function: linear; border-radius: 50%; }
        .bg-bubbles li:nth-child(1) { left: 10%; }
        .bg-bubbles li:nth-child(2) { left: 20%; width: 80px; height: 80px; animation-delay: 2s; animation-duration: 17s; }
        .bg-bubbles li:nth-child(3) { left: 25%; animation-delay: 4s; }
        .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 22s; background-color: rgba(255, 255, 255, 0.2); }
        .bg-bubbles li:nth-child(5) { left: 70%; }
        .bg-bubbles li:nth-child(6) { left: 80%; width: 120px; height: 120px; animation-delay: 3s; }
        .bg-bubbles li:nth-child(7) { left: 32%; width: 140px; height: 140px; animation-delay: 7s; }
        .bg-bubbles li:nth-child(8) { left: 55%; width: 20px; height: 20px; animation-delay: 15s; }
        .bg-bubbles li:nth-child(9) { left: 25%; width: 15px; height: 15px; animation-delay: 2s; }
        .bg-bubbles li:nth-child(10) { left: 90%; width: 130px; height: 130px; animation-delay: 11s; }
        @keyframes square { 0% { transform: translateY(0); } 100% { transform: translateY(-1200px) rotate(600deg); } }

        /* Responsive Fullscreen Pages */
        .page { 
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out; 
            transform: scale(0.96); 
            padding: 24px 16px; 
            z-index: 10;
        }
        .page.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: scale(1); 
        }

        .center-content {
            margin: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Polaroid Effect */
        .polaroid { 
            background: white; 
            padding: 12px 12px 28px 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            transform: rotate(-2deg); 
            transition: transform 0.3s; 
            width: 270px; 
            max-width: 90vw; 
            border-radius: 4px;
        }
        .polaroid:hover { transform: rotate(0deg) scale(1.03); }
        .polaroid img { 
            width: 100%; 
            height: 310px; 
            object-fit: cover; 
            border-radius: 2px;
            background: #f1f5f9; 
        }
        .polaroid-text { 
            color: #1e293b; 
            font-family: 'Brush Script MT', cursive, sans-serif; 
            font-size: 24px; 
            text-align: center; 
            margin-top: 12px; 
        }

        /* Glassmorphism Card */
        .glass-card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.18); 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); 
            width: 100%; 
            max-width: 540px; 
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-purple-950">

    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- PAGE 1: The Surprise -->
    <div id="page1" class="page active">
        <div class="center-content text-center py-6">
            <h1 class="text-3xl sm:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-300">
                I Have a Surprise For You...
            </h1>
            <p class="text-base sm:text-lg text-gray-300 mb-8 font-light">Are you ready?</p>
            <button onclick="nextPage(2)" class="px-8 py-3 sm:py-4 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full font-bold text-lg sm:text-xl hover:scale-105 transition-transform shadow-lg shadow-purple-500/40">
                Open the Surprise ✨
            </button>
        </div>
    </div>

    <!-- PAGE 2: The Memory -->
    <div id="page2" class="page">
        <div class="center-content text-center py-6">
            <h2 class="text-2xl sm:text-4xl font-bold mb-6 text-pink-200">
                To the most beautiful person...
            </h2>
            
            <div class="polaroid mx-auto mb-6">
                <!-- Using exact image name -->
                <img src="image_9ac23c.jpg" alt="Tonoy's Picture">
                <div class="polaroid-text">Keep smiling always! ❤️</div>
            </div>

            <button onclick="nextPage(3)" class="px-8 py-2.5 bg-white/20 hover:bg-white/30 border border-white/40 rounded-full font-semibold text-base backdrop-blur-sm transition-all shadow-md">
                Continue ➡️
            </button>
        </div>
    </div>

    <!-- PAGE 3: The Party -->
    <div id="page3" class="page">
        <div class="center-content py-6">
            <div class="glass-card p-6 sm:p-10 rounded-3xl text-center">
                <h1 class="text-3xl sm:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-300 to-purple-300">
                    Happy Birthday, Tonoy! 🎂
                </h1>
                
                <p class="text-base sm:text-lg text-gray-200 mb-8 leading-relaxed font-light">
                    Wishing you a day filled with happiness and a year filled with joy. 
                    May all your dreams come true today and always. Have a blast! 🎉
                </p>
                
                <button onclick="fireConfetti()" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-yellow-400 via-orange-500 to-pink-500 hover:opacity-90 text-white font-bold rounded-full shadow-lg shadow-orange-500/40 transform hover:-translate-y-0.5 transition duration-200 text-lg">
                    Trigger the Magic! 🎊
                </button>
            </div>
        </div>
    </div>

    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById('page' + pageNumber).classList.add('active');
            
            if (pageNumber === 3) {
                setTimeout(() => {
                    confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 } });
                }, 400);
            }
        }

        function fireConfetti() {
            var duration = 3.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0055', '#00ffcc', '#ffcc00', '#aa00ff', '#ffffff']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0055', '#00ffcc', '#ffcc00', '#aa00ff', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
